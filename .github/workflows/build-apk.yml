name: Build APK

on:
  push:
    branches:
      - claude/wealth-debt-tracker-app-176x9j
    paths:
      - "wealth_tracker/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug

      - name: Verify built APK (installability diagnostics)
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          echo "--- file size/hash ---"
          ls -la "$APK"
          sha256sum "$APK"
          echo "--- zip integrity ---"
          unzip -t "$APK" > /dev/null && echo "zip structure OK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "--- using build-tools: $BUILD_TOOLS ---"
          echo "--- aapt2 dump badging (manifest sanity) ---"
          "$BUILD_TOOLS/aapt2" dump badging "$APK"
          echo "--- apksigner verify (same check the OS installer relies on) ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs -v "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-tracker-debug-apk
          path: wealth_tracker/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
