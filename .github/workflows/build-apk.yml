name: Build APK

on:
  push:
    branches:
      - claude/wealth-debt-tracker-app-176x9j
    paths:
      - "wealth_tracker/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-tracker-debug-apk
          path: wealth_tracker/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
