name: Build APK

on:
  push:
    branches:
      - claude/wealth-debt-tracker-app-176x9j
    paths:
      - "wealth_tracker/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      # --build-number becomes the APK's versionCode -- the in-app "Check
      # for updates" feature (Settings > App updates) compares its own
      # installed versionCode against this same run number read back from
      # the public app-releases repo, so it has to be injected here, not
      # left to whatever pubspec.yaml's build number says (that isn't
      # bumped on every commit). This build is only ever used to prove the
      # APK compiles and installs cleanly -- the `publish` job (gated on
      # this job and verify-quick-add both succeeding) rebuilds with the
      # same --build-number itself rather than reusing this one, so this
      # job carries no publishing credential of its own.
      - run: |
          flutter build apk --debug \
            --build-number=${{ github.run_number }}

      - name: Verify built APK (installability diagnostics)
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          echo "--- file size/hash ---"
          ls -la "$APK"
          sha256sum "$APK"
          echo "--- zip integrity ---"
          unzip -t "$APK" > /dev/null && echo "zip structure OK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "--- using build-tools: $BUILD_TOOLS ---"
          echo "--- aapt2 dump badging (manifest sanity) ---"
          "$BUILD_TOOLS/aapt2" dump badging "$APK"
          echo "--- apksigner verify (same check the OS installer relies on) ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs -v "$APK"

      # Non-blocking on purpose: this raw workflow artifact is now a
      # convenience only, superseded by the public app-releases repo below
      # (which is what the in-app updater and any manual download actually
      # use). Its own storage quota is separate and small, so a run here
      # failing on "storage quota has been hit" -- as this repo's backlog
      # of old debug-APK artifacts eventually did, since nothing was ever
      # deleting them -- must not take down the step that actually matters.
      # A short retention keeps that backlog from building back up.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wealth-tracker-debug-apk
          path: wealth_tracker/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  # Actually installs the built APK on a real (emulated) Android device and
  # fires the exact system broadcast a tap on the SMS charge-review
  # notification's "Quick add" action sends -- twice in a row, with a real
  # JSON payload against a real, seeded SMS Rule -- rather than inferring
  # from reading source whether that path still works. Three real bugs
  # have lived in this exact path and none were obvious from a source read
  # alone:
  #   1. The app's own manifest never declared flutter_local_notifications'
  #      ActionBroadcastReceiver at all, so the broadcast that action's
  #      PendingIntent sends had no registered component to reach at all
  #      (see AndroidManifest.xml's own comment on that <receiver>).
  #   2. That receiver's stock implementation caches the headless
  #      FlutterEngine it spins up in a field it never resets, so only the
  #      *first* tap in the process's life ever got through (see
  #      third_party/flutter_local_notifications' own patched
  #      ActionBroadcastReceiver.java).
  #   3. Its own static ActionEventSink kept a stale EventSink from the
  #      *previous* (by then destroyed) engine, so a second tap's data was
  #      fired into a dead channel instead of the cache the next engine's
  #      listener would flush -- same file, same patch.
  # An earlier version of this job only ever sent a fake, non-JSON payload
  # ("test") specifically to dodge needing a matching rule -- which meant
  # it only ever proved the broadcast reaches Dart, not that Quick Add's
  # own effect (a ledger entry) ever actually happens. It passed while the
  # button still didn't really work. This version seeds one real matching
  # SmsRule (see "Build the seed database..." below) and checks the
  # on-device database for the ledger entries Quick Add is supposed to
  # create, not just a debug log line. Self-contained (its own
  # checkout/build) rather than reusing the `build` job's APK via
  # actions/upload-artifact, since that step is already known to fail
  # outright when this account's separate artifact-storage quota is
  # exhausted -- a real APK to install is the one thing this job cannot
  # proceed without.
  #
  # A fourth real bug lived in the *other* half of this same notification:
  # a plain tap on its body (not the Quick Add action) is supposed to open
  # SmsReviewScreen so the user can pick a ledger, but processIncomingSms
  # marked the SMS "processed" before it even knew whether a Navigator
  # would show up in time to push that screen -- and on a genuinely cold
  # start (the process killed, this tap relaunching it), it easily
  # wouldn't within the 1 second it used to allow. Losing that race meant
  # the charge was silently consumed with no screen ever shown and no way
  # to retry -- reported as "it opens, sometimes to the last page, but
  # never shows a picker". This job's script now also force-stops the app,
  # fires the exact SELECT_NOTIFICATION Intent flutter_local_notifications
  # itself sends for a body tap, and checks both logcat and a real
  # uiautomator UI dump for SmsReviewScreen's "Confirm payment" AppBar
  # title actually appearing on screen -- not just a log line claiming it
  # was pushed.
  verify-quick-add:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth_tracker
    steps:
      - uses: actions/checkout@v4

      # The Flutter build's own SDK/Gradle downloads plus the emulator's
      # system-image download together don't fit in this runner's default
      # free space -- confirmed by an actual run dying mid-emulator-setup
      # with "No space left on device" after the APK had already built
      # fine on its own. None of this preinstalled tooling is used by this
      # job; freeing it is the standard fix for GitHub-hosted runners
      # running out of disk. Deliberately does NOT touch /usr/local/lib
      # /android -- that's the real Android SDK this job needs.
      - name: Free disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug --build-number=${{ github.run_number }}

      # A real Quick Add tap only does anything (a ledger entry) when a
      # saved SMS Rule matches the tapped notification's original SMS
      # text -- a fresh install/emulator has none. Built via a real
      # `flutter test` (AppDatabase.forTesting against a real file, not
      # in-memory) rather than hand-written SQL, so the seeded rows go
      # through the app's own schema/migration/JSON-encoding code instead
      # of something that could quietly drift out of sync with it. See
      # this file's own doc comment for why an earlier version of this
      # job never caught Quick Add still not working for real.
      - name: Build the seed database Quick Add's real effect is checked against
        run: flutter test ci/build_seed_db_test.dart
        env:
          SEED_DB_OUTPUT: build/seed.sqlite

      # Ground truth, before ever touching an emulator: does the actual
      # compiled manifest inside the APK that's about to be installed
      # really contain the ActionBroadcastReceiver <receiver> entry? A
      # previous run's on-device broadcast test found no evidence the
      # Dart callback ever ran for either tap, and dumpsys package on the
      # device didn't show the receiver either -- this settles whether
      # that's a real manifest problem or just dumpsys/adb not showing
      # something that's actually there, using the same aapt2 the "build"
      # job's own manifest-sanity step already relies on.
      - name: Dump the compiled manifest's receivers (ground truth)
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > manifest_dump.txt
          echo "--- every <receiver> entry in the compiled manifest ---"
          grep -B2 -A6 "receiver" manifest_dump.txt || echo "NO <receiver> ELEMENTS FOUND AT ALL"
          echo "--- specifically looking for ActionBroadcastReceiver ---"
          grep -B8 "ActionBroadcastReceiver" manifest_dump.txt || echo "ActionBroadcastReceiver NOT FOUND in the compiled manifest"

      # The build itself downloads its own build-tools/CMake/etc. -- freed
      # again here since the emulator's system-image download is what
      # actually ran this runner out of space, right after a build that
      # looked completely unrelated succeeded.
      - name: Free Gradle/Android build caches before the emulator download
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper || true
          df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `default` (plain AOSP, no Google Play Services) rather than
      # `google_apis` -- this test only ever fires a raw system broadcast
      # at a manifest-registered receiver, nothing here touches Play
      # Services, and the AOSP image is meaningfully smaller/faster, which
      # matters directly for the disk space this job already ran out of.
      - name: Boot an emulator and verify both Quick Add and the notification's body tap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # A real script file, not an inline block -- this action runs
          # each line of an inline `script:` as its own independent shell
          # invocation (confirmed by an actual run: a variable assigned on
          # one line read back empty on the next, and a multi-line `if`
          # split across invocations hit "syntax error: unexpected end of
          # file"). `bash <file>` parses the whole thing exactly once.
          script: bash wealth_tracker/ci/verify_quick_add.sh

  # Publishes the release the in-app updater and any manual download
  # actually use -- gated on *both* `build` (the APK genuinely compiles)
  # and `verify-quick-add` (Quick Add and the notification's body tap are
  # proven working against a real device) succeeding first. GitHub Actions
  # only runs a job once every job named in `needs` has succeeded, and
  # skips it outright the moment either one fails or is cancelled -- this
  # is the one thing standing between "the emulator test caught a real
  # Quick Add regression" and that same broken build still reaching the
  # in-app updater regardless, which two separate, un-gated jobs publishing
  # in parallel used to allow. Never weaken this to `if: always()` or an
  # explicit success-of-one-job check -- the whole point is that a genuine
  # verify-quick-add failure must make a release impossible, not just
  # logged.
  #
  # Rebuilds the APK itself rather than downloading `build`'s own
  # artifact -- same reasoning as `verify-quick-add`'s own self-contained
  # checkout/build (see that job's comment): the artifact upload is
  # already known to fail outright when this account's separate
  # artifact-storage quota is exhausted, and that's a completely
  # orthogonal failure mode with nothing to do with whether the app itself
  # is fit to publish.
  publish:
    needs: [build, verify-quick-add]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: |
          flutter build apk --debug \
            --build-number=${{ github.run_number }}

      # Gives the in-app updater a stable, permanent place to check/download
      # from -- unlike a workflow artifact (requires a GitHub login, expires
      # in days), a Release asset is addressable by a fixed URL for as
      # long as the release exists, which is what the app polls.
      #
      # Published to a separate, *public* repo (YahiaElghayesh/app-releases)
      # rather than this one -- this repo stays private, but a public
      # release's assets are plain, unauthenticated HTTPS URLs, so the
      # installed app never needs to carry a GitHub credential of its own
      # to check for or download an update (see app_update_service.dart's
      # own doc comment). The default `github.token` only has permissions
      # within *this* repo, not app-releases, so publishing there needs its
      # own credential: RELEASES_REPO_TOKEN, a fine-grained PAT scoped to
      # app-releases with Contents: Read and write (see README).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk wealth-tracker-debug.apk
          # A plain-text checksum asset alongside the APK -- lets the
          # in-app updater verify what it downloaded actually matches what
          # CI built and published, rather than trusting the download
          # transport alone. `awk` strips the filename sha256sum prints
          # after the hash, since the app only wants the hex digest itself.
          sha256sum wealth-tracker-debug.apk | awk '{print $1}' > wealth-tracker-debug.apk.sha256
          gh release create "build-${{ github.run_number }}" \
            wealth-tracker-debug.apk wealth-tracker-debug.apk.sha256 \
            --repo "YahiaElghayesh/app-releases" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated debug build from commit ${{ github.sha }}." \
            --latest
